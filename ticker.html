<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 44px; overflow: hidden;
  background: #080C18;
  font-family: 'SF Mono', 'JetBrains Mono', 'Courier New', monospace;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
.bar {
  display: flex; align-items: center;
  height: 44px; overflow: hidden;
  border-bottom: 1px solid #1E2D45;
}
.brand {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px;
  border-right: 1px solid #1E2D45;
  height: 44px;
  cursor: pointer;
}
.brand-icon {
  width: 20px; height: 20px;
  background: linear-gradient(135deg, #F59E0B, #EF4444);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #000;
}
.brand-name {
  font-size: 12px; font-weight: 800;
  color: #fff; letter-spacing: -.3px;
  font-family: 'Inter', sans-serif;
}
.brand-name span { color: #F59E0B; }
.ticker-track { flex: 1; overflow: hidden; height: 44px; display: flex; align-items: center; }
.ticker-scroll {
  display: flex; gap: 0;
  animation: scroll 60s linear infinite;
  white-space: nowrap; align-items: center;
}
.ticker-scroll:hover { animation-play-state: paused; }
.ticker-item {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; height: 44px;
  border-right: 1px solid #1A2236;
  cursor: pointer; transition: background .15s;
  flex-shrink: 0;
}
.ticker-item:hover { background: #111827; }
.ticker-sym { font-size: 12px; font-weight: 700; color: #E5E9F0; }
.ticker-price { font-size: 12px; color: #94A3B8; }
.ticker-chg { font-size: 11px; font-weight: 600; }
.up { color: #10B981; } .dn { color: #EF4444; }
.controls {
  flex-shrink: 0; display: flex; align-items: center;
  border-left: 1px solid #1A2236; height: 44px;
}
.ctrl-btn {
  width: 40px; height: 44px;
  background: transparent; border: none;
  color: #475569; font-size: 13px;
  cursor: pointer; transition: color .15s;
  display: flex; align-items: center; justify-content: center;
}
.ctrl-btn:hover { color: #F59E0B; }
.loading { color: #475569; font-size: 12px; padding: 0 20px; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand" id="brand-logo" title="Open Cryptikr">
    <div class="brand-icon">₿</div>
    <div class="brand-name">Crypti<span>kr</span></div>
  </div>
  <div class="ticker-track">
    <div class="ticker-scroll" id="ticker-scroll">
      <div class="loading">Loading prices...</div>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-settings" title="Settings">⚙</button>
  </div>
</div>

<script>
var settings = { coins: ['bitcoin','ethereum','solana','ripple','dogecoin'], speed: 50 };
var prices = [];

function fmtPrice(p) {
  if (p >= 10000) return '$' + Math.round(p).toLocaleString();
  if (p >= 1)     return '$' + p.toFixed(2);
  return '$' + p.toFixed(4);
}

function buildTicker() {
  var scroll = document.getElementById('ticker-scroll');
  if (!prices.length) { scroll.innerHTML = '<div class="loading">No data</div>'; return; }
  function makeItems() {
    return prices.map(function(c) {
      var up = (c.price_change_percentage_24h || 0) >= 0;
      var pct = (c.price_change_percentage_24h || 0).toFixed(2);
      return '<div class="ticker-item" data-id="' + c.id + '">'
        + '<span class="ticker-sym">' + (c.symbol||'').toUpperCase() + '</span>'
        + '<span class="ticker-price">' + fmtPrice(c.current_price||0) + '</span>'
        + '<span class="ticker-chg ' + (up?'up':'dn') + '">' + (up?'+':'') + pct + '%</span>'
        + '</div>';
    }).join('');
  }
  var html = makeItems() + makeItems();
  scroll.innerHTML = html;
  var dur = Math.max(10, 120 - settings.speed + 20);
  scroll.style.animationDuration = dur + 's';

  scroll.querySelectorAll('.ticker-item').forEach(function(el) {
    el.addEventListener('click', function() {
      window.api.openCryptikr(el.getAttribute('data-id'));
    });
  });
}

async function loadPrices() {
  try {
    var data = await window.api.fetchPrices();
    if (data && data.length) {
      prices = data;
      buildTicker();
    }
  } catch(e) { console.error('Price fetch error:', e); }
}

async function init() {
  try {
    settings = await window.api.getSettings();
  } catch(e) {}
  await loadPrices();
  setInterval(loadPrices, 60000);
}

document.getElementById('brand-logo').addEventListener('click', function() {
  window.api.openCryptikr('');
});
document.getElementById('btn-settings').addEventListener('click', function() {
  window.api.openSettings();
});

init();
</script>
</body>
</html>
